name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA (macos-26-intel)
    runs-on: macos-26-intel
    timeout-minutes: 45

    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Show macOS and Xcode toolchain info
        run: |
          uname -a
          sw_vers
          xcodebuild -version
          pod --version

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run static verification gates
        run: npm run verify

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_PATH=$(find ios -maxdepth 1 -name '*.xcworkspace' -not -name 'Pods.xcworkspace' | head -n 1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "Error: No .xcworkspace found in ios/"
            exit 1
          fi
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          echo "Using workspace: $WORKSPACE_PATH, scheme: $SCHEME_NAME"

          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            -archivePath ios/build/CNBPanel.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find ios/build/CNBPanel.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle produced inside archive"
            exit 1
          fi

          rm -rf ios/build/ipa-staging ios/build/CNBPanel-unsigned.ipa
          mkdir -p ios/build/ipa-staging/Payload
          cp -R "$APP_PATH" ios/build/ipa-staging/Payload/
          (cd ios/build/ipa-staging && zip -r -y "../CNBPanel-unsigned.ipa" Payload)

          ls -lh ios/build/CNBPanel-unsigned.ipa
          unzip -l ios/build/CNBPanel-unsigned.ipa | head -n 30

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CNBPanel-unsigned-ipa
          path: ios/build/CNBPanel-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
